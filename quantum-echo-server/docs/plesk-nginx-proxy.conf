# Plesk: Additional nginx directives (Domains > api.example.com > Apache & Nginx Settings)
# Place this into the "Additional nginx directives" box and click Apply.

# Proxy API endpoints to local Gunicorn
location ~ ^/(quantum_text|quantum_gate|quantum_echo_types|health|)$ {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://127.0.0.1:8000;
}

# Ensure static files in 'public/' are served by Plesk's nginx (document root should be set to public/)
